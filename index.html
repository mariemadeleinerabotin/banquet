<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EEE6D6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1513" media="(prefers-color-scheme: dark)">
<title>Le Banquet</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Le Banquet">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..500;1,400&family=Instrument+Sans:wght@400..600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Le Banquet — mobile d'abord. Une colonne de lecture, la carte du jour en diapositives, une barre d'onglets fixée en bas.
   Système : 7 tailles de texte, espacements base 4, trois blocs (feuille, note, inversé), deux boutons. */
:root{
  --paper:#EEE6D6; --sheet:#F6F0E4; --ink:#1E1714; --muted:#6E625A; --rule:#D9CDB8;
  --accent:#5E1B16; --on-accent:#F6F0E4; --accent-soft:#E7D6C6; --mark:#7A5520; --bad:#9B3B2E; --bad-soft:#F0DAD3;
  --inv-bg:#1E1714; --inv-fg:#EEE6D6; --inv-muted:#B8AA9C; --inv-mark:#C9A35E;
  --idee-bg:#5E1B16; --idee-fg:#F6F0E4;
  --display:"EB Garamond","Garamond","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ui:var(--body);
  --t-display:36px; --t-h1:28px; --t-h2:24px; --t-h3:20px; --t-lead:18px; --t-body:16px; --t-small:14px; --t-label:11.5px;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1A1513; --sheet:#231C19; --ink:#EEE6D6; --muted:#A99C8F; --rule:#3A302B;
  --accent:#D99A8C; --on-accent:#1A1513; --accent-soft:#33261F; --mark:#D9B868; --bad:#E39A8D; --bad-soft:#40201C;
  --inv-bg:#2E2420; --inv-fg:#EEE6D6; --inv-muted:#A99C8F; --inv-mark:#D9B868;
  --idee-bg:#4A1A15; --idee-fg:#EEE6D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1A1513; --sheet:#231C19; --ink:#EEE6D6; --muted:#A99C8F; --rule:#3A302B;
  --accent:#D99A8C; --on-accent:#1A1513; --accent-soft:#33261F; --mark:#D9B868; --bad:#E39A8D; --bad-soft:#40201C;
  --inv-bg:#2E2420; --inv-fg:#EEE6D6; --inv-muted:#A99C8F; --inv-mark:#D9B868;
  --idee-bg:#4A1A15; --idee-fg:#EEE6D6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:var(--t-body);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:600px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.label{font-family:var(--ui);font-size:var(--t-label);line-height:1.3;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 8px}
.hint{font-family:var(--ui);font-size:var(--t-small);color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2.page{font-family:var(--display);font-weight:500;font-size:var(--t-display);color:var(--accent);line-height:1.08;margin:24px 0 8px}
.page-intro{margin:0 0 4px}

header.mast{padding-block:16px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mast h1{font-family:var(--display);font-weight:500;font-size:var(--t-h1);line-height:1;margin:0;color:var(--accent)}
.mast .sem{font-family:var(--ui);font-size:12px;line-height:1.35;color:var(--muted);text-align:right}
.mast .sem b{font-weight:500;color:var(--ink)}

/* barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--ui);font-size:var(--t-label);color:var(--muted);position:relative}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);font-size:10px;background:var(--accent);color:var(--on-accent);border-radius:9px;padding:1px 5px;font-variant-numeric:tabular-nums;line-height:1.4}

/* semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:16px 0 0}
.week button{background:none;border:0;min-height:56px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--ui);font-size:11px;color:var(--muted);min-width:0}
.week .dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-family:var(--display);font-size:16px;background:var(--sheet)}
.week button.has .dot{border-color:var(--ink);color:var(--ink)}
.week button.on .dot{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.week button.future .dot{border-style:dashed;background:transparent}
.week-hint{min-height:0;margin:6px 0 0}
.week-hint:empty{display:none}

/* blocs : feuille, note, inversé */
.block{margin-top:32px}
.note{background:var(--accent-soft);border-left:2px solid var(--accent);padding:14px 16px}
.note p{margin:0 0 8px}
.note p:last-child{margin-bottom:0}
.banner{display:flex;gap:12px;align-items:center;margin-top:16px}
.banner p{margin:0;flex:1;min-width:0}
.banner b{font-weight:600}
.intro{margin-top:16px}
.intro .row{margin-top:12px}
details.howto summary{cursor:pointer;color:var(--accent);font-family:var(--ui);font-size:var(--t-small);min-height:32px;display:flex;align-items:center}
details.howto p{font-size:var(--t-small)}

/* deck de diapositives */
.deck{margin-top:16px;background:var(--sheet);border:1px solid var(--rule);position:relative}
.bars{display:flex;gap:4px;padding:12px 14px 0}
.bars i{flex:1;height:3px;background:var(--rule);border-radius:2px}
.bars i.on{background:var(--accent)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;min-height:360px;padding:28px 22px 24px;display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.slide .eyebrow{font-family:var(--ui);font-size:var(--t-label);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
.slide h2{font-family:var(--display);font-weight:500;font-size:var(--t-display);line-height:1.08;margin:0 0 16px;text-wrap:balance;color:var(--accent)}
.slide .accroche{font-size:var(--t-lead);line-height:1.55;margin:0;color:var(--muted)}
.slide p.txt{font-size:var(--t-lead);line-height:1.55;margin:0}
.slide .num{font-family:var(--display);font-size:32px;color:var(--accent);opacity:.35;line-height:1;margin-bottom:12px}
.slide.quote{color:var(--accent)}
.slide.quote blockquote{margin:0;font-family:var(--display);font-style:normal;font-weight:400;font-size:26px;line-height:1.28}
.slide.quote cite{display:block;margin-top:16px;font-style:normal;font-family:var(--ui);font-size:13px;color:var(--muted);text-align:right}
.slide.ex .kind{align-self:flex-start;font-family:var(--ui);font-size:var(--t-label);letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--mark);color:var(--mark);margin-bottom:16px}
.slide.ex h3{font-family:var(--display);font-weight:500;font-size:var(--t-h2);line-height:1.15;margin:0 0 4px}
.slide.ex .by{font-family:var(--ui);font-size:13px;color:var(--muted);margin:0 0 16px}
.slide.idee{background:var(--idee-bg);color:var(--idee-fg)}
.slide.idee .eyebrow{color:inherit;opacity:.8}
.slide.idee p:not(.eyebrow){font-family:var(--display);font-size:26px;line-height:1.3;font-weight:400;margin:0}
.navbtns{display:flex;justify-content:space-between;align-items:center;padding:0 6px 4px}
.navbtns button{background:none;border:0;font-family:var(--ui);font-size:var(--t-small);color:var(--accent);min-height:44px;padding:0 10px}
.navbtns button:disabled{color:var(--muted);opacity:.5}

/* sous le deck */
.fait{background:var(--sheet);border:1px solid var(--rule);padding:20px 18px;display:flex;flex-direction:column;gap:6px}
.fait .label{color:var(--accent);margin:0}
.fait .ft{font-family:var(--display);font-weight:500;font-size:var(--t-h2);line-height:1.2;margin:4px 0 2px;color:var(--accent);text-wrap:balance}
.fait p.tx{margin:0}
.fait .src{font-family:var(--ui);font-size:12px;color:var(--muted);margin:8px 0 0}
.defi-head{display:flex;justify-content:space-between;align-items:baseline}
.ddeck{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;scroll-padding:0 16px}
.ddeck::-webkit-scrollbar{display:none}
.dcard{flex:0 0 86%;scroll-snap-align:start;background:var(--sheet);border:1px solid var(--rule);padding:20px 18px;min-height:280px;display:flex;flex-direction:column;min-width:0}
.dcard:only-of-type,.dcard.solo{flex-basis:100%}
.dcard .n{font-family:var(--ui);font-size:var(--t-label);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.dcard .q{font-family:var(--display);font-size:var(--t-h2);line-height:1.2;margin:10px 0 16px}
.dcard .res{margin-top:12px;font-size:var(--t-small);line-height:1.45}
.dcard .go{margin-top:auto;align-self:flex-start}
.dcard .res + .go{margin-top:16px}
.dcard.fin .sc{font-family:var(--display);font-size:64px;line-height:1;color:var(--accent);margin-top:8px}
.dcard.fin .sc small{font-size:24px;color:var(--muted)}
.dcard.fin p{margin:8px 0 0}
.toi .q{font-family:var(--display);font-size:var(--t-h3);margin:0 0 12px;line-height:1.3}
textarea,input[type=search],input[type=text]{width:100%;font:inherit;font-size:var(--t-body);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);padding:10px 12px;min-height:44px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* deux boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;font:500 14px/1 var(--ui);letter-spacing:.02em;min-height:44px;padding:0 18px;
  background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:0}
.btn:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent);border-color:currentColor}
.btn:disabled{background:transparent;color:var(--muted);border:1px dashed var(--rule);cursor:default}
.reply{margin-top:14px;white-space:pre-wrap;border-left:2px solid var(--accent);padding-left:14px}
.reply:empty{display:none}
details.loin{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
details.loin summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font-family:var(--ui);font-size:var(--t-small);color:var(--accent)}
details.loin summary::-webkit-details-marker{display:none}
details.loin summary::after{content:"+"}
details.loin[open] summary::after{content:"–"}
details.loin .inner{padding-bottom:16px}
details.loin p{margin:0 0 12px}
.lectures{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}

/* mini-cartes de penseurs */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:var(--sheet);border:1px solid var(--rule);padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard .fn{font-family:var(--ui);font-size:12px;color:var(--muted)}
.pcard .ln{font-family:var(--display);font-size:22px;line-height:1.05;font-weight:500;overflow-wrap:anywhere}
.pcard .d{font-family:var(--ui);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard .mot{font-size:var(--t-small);margin-top:8px;line-height:1.4;color:var(--muted)}

/* synthèse et quiz */
.duel{display:grid;gap:0}
.duel .pos{border-bottom:1px solid var(--rule);padding:12px 0}
.duel .pos b{font-family:var(--display);font-weight:500;font-size:var(--t-h3);display:block}
.qblock{display:grid;gap:20px}
.qq{font-weight:500;margin:0 0 8px;font-size:var(--t-lead)}
.opts{display:grid;gap:6px}
.opts button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--sheet);border:1px solid var(--rule);min-height:44px;padding:10px 12px;font-size:var(--t-body);line-height:1.3}
.opts button.ok{border:1.5px solid var(--ink);background:var(--sheet);font-weight:500}
.opts button.ok::after{content:"✓";color:var(--accent);font-weight:600}
.opts button.ko{border-color:var(--bad);background:var(--bad-soft);color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.opts button.ko::after{content:"✕";color:var(--bad);text-decoration:none}
.opts button:disabled{cursor:default}
.opts button:disabled:not(.ok):not(.ko){opacity:.55}
.ex{font-size:var(--t-small);color:var(--muted);margin:8px 0 0}
.verdict{font-family:var(--ui);font-weight:600}
.verdict.good{color:var(--accent)}
.verdict.bad{color:var(--bad)}

/* réviser */
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.game{background:var(--sheet);border:1px solid var(--rule);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;min-width:0}
.game .gt{font-family:var(--display);font-size:var(--t-h3);line-height:1.1;color:var(--ink)}
.game .gd{font-size:var(--t-small);color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.game .mbar{margin-top:auto}
.game .mtx{font-family:var(--ui);font-size:12px;color:var(--muted)}
.game .mtx b{color:var(--ink);font-weight:600}
.game.wide{grid-column:1 / -1;min-height:0}
.game.wide .gt{color:var(--accent);font-size:var(--t-h2)}
.game.wide .gc{font-family:var(--ui);font-size:12px;color:var(--accent);margin-top:6px}
.game:disabled{background:transparent;border-style:dashed;cursor:default}
.game:disabled .gt{color:var(--muted)}
.game:disabled .mbar{visibility:hidden}
.lock{margin:20px 0 0;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.play{margin-top:16px}
.play .top{display:flex;justify-content:space-between;align-items:center}
.play .top button{background:none;border:0;font-family:var(--ui);font-size:var(--t-small);color:var(--accent);min-height:44px;padding:0}
.prog{height:3px;background:var(--rule);margin:4px 0 16px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{background:var(--sheet);border:1px solid var(--rule);padding:22px 18px;min-height:300px;display:flex;flex-direction:column}
.qcard .kind{font-family:var(--ui);font-size:var(--t-label);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.qcard .prompt{font-family:var(--display);font-size:var(--t-h2);line-height:1.25;margin:0 0 18px}
.qcard .src{font-family:var(--ui);font-size:13px;color:var(--muted);margin:-10px 0 16px}
.qcard .ask{font-size:var(--t-body);color:var(--muted);margin:0 0 8px}
.qcard .terme{font-family:var(--display);font-size:34px;line-height:1.1;margin:4px 0 8px}
.qcard .back{border-top:1px solid var(--rule);padding-top:14px;margin-top:14px}
.qcard .back p{margin:0 0 8px}
.qcard .back .formule{font-family:var(--display);font-size:var(--t-h3);color:var(--accent)}
.qcard .acts{margin-top:auto;padding-top:18px}
.feedback{margin-top:14px;line-height:1.45}
.feedback .who{display:block;font-family:var(--display);font-size:var(--t-h3);margin:2px 0 4px}
.score{background:var(--sheet);border:1px solid var(--rule);padding:22px 18px}
.score .big{font-family:var(--display);font-size:64px;line-height:1;color:var(--accent);margin:6px 0 10px}
.score .big small{font-size:24px;color:var(--muted)}
.score p{margin:0 0 6px}
.empty{color:var(--muted);margin:18px 0}

/* penseurs */
.era{margin-top:24px}
.era h3{font-family:var(--ui);font-size:var(--t-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 10px;display:flex;gap:10px;align-items:center}
.era h3::after{content:"";flex:1;height:1px;background:var(--rule)}

/* parcours */
.seg{display:flex;gap:20px;border-bottom:1px solid var(--rule);margin-top:16px}
.seg button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px;padding:0;font-family:var(--ui);font-size:var(--t-small);color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.wk{border-bottom:1px solid var(--rule);padding:14px 0}
.wk .h{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:10px;align-items:baseline}
.wk .n{font-family:var(--display);font-size:var(--t-h3);color:var(--muted);font-variant-numeric:tabular-nums}
.wk .nt,.up .nt{display:block;font-family:var(--display);font-size:22px;line-height:1.15}
.wk .qs,.up .qs{font-size:var(--t-small);color:var(--muted);display:block}
.dom{display:block;margin-bottom:2px;font-family:var(--ui);font-size:var(--t-label);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.wk .days{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 calc(2.4em + 10px)}
.chip{display:inline-flex;align-items:center;font-family:var(--ui);font-size:13px;min-height:36px;padding:0 12px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;text-align:left}
.pick{font-family:var(--ui);font-size:13px;min-height:36px;padding:0 10px;border:1px solid var(--rule);background:var(--sheet);white-space:nowrap}
.pick[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.filters button{font-family:var(--ui);font-size:13px;min-height:36px;padding:0 12px;border:1px solid var(--rule);background:transparent;border-radius:999px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.az{list-style:none;padding:0;margin:8px 0 0}
.az li button{width:100%;background:none;border:0;border-bottom:1px solid var(--rule);min-height:48px;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-align:left}
.az .t{font-family:var(--display);font-size:var(--t-h3)}
.az .k{font-family:var(--ui);font-size:12px;color:var(--muted);white-space:nowrap}
.status{font-family:var(--ui);font-size:13px;color:var(--muted);margin-top:8px;min-height:1.2em}
details.how{margin-top:32px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
details.how summary{cursor:pointer;list-style:none;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-family:var(--ui);font-size:var(--t-small);color:var(--accent)}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"+"}
details.how[open] summary::after{content:"–"}
details.how .inner{padding-bottom:14px}
details.how p{margin:0 0 10px}

/* fiche plein écran */
.sheet{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:600px;margin:0 auto}
.sheet .closebar{position:sticky;top:0;z-index:2;background:var(--paper);padding-top:env(safe-area-inset-top,0px);margin:0 -2px}
.sheet .close{background:none;border:0;font-family:var(--ui);font-size:var(--t-small);color:var(--accent);min-height:44px;padding:0 2px}
.idcard{background:var(--inv-bg);color:var(--inv-fg);padding:22px 20px;margin-top:4px}
.idcard .fn{font-family:var(--ui);font-size:13px;color:var(--inv-muted)}
.idcard .ln{font-family:var(--display);font-size:46px;line-height:1;font-weight:500;overflow-wrap:anywhere}
.idcard .ln.small{font-size:var(--t-display)}
.idcard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--ui);font-size:13px;color:var(--inv-muted);margin-top:10px}
.idcard .mot{font-size:var(--t-body);line-height:1.45;margin-top:14px;color:var(--inv-mark)}
.sec{margin-top:24px}
.sec p{margin:0 0 10px}
.prose p{max-width:34em}
.theses{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.theses li{padding-left:16px;position:relative}
.theses li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:1px;background:var(--accent)}
.cit{margin:0 0 12px;padding-left:14px;border-left:1px solid var(--ink)}
.cit p{font-family:var(--display);font-style:normal;margin:0;font-size:var(--t-h3);line-height:1.3}
.cit span{font-family:var(--ui);font-size:12px;color:var(--muted)}
.rows{border-top:1px solid var(--rule)}
.rowline{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 0;min-height:48px}
.rowline .k{display:block;font-family:var(--ui);font-size:var(--t-label);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.rowline .v{font-family:var(--display);font-size:var(--t-h3)}
.rowline .s{color:var(--muted);font-size:var(--t-small)}
.rowline.later .v{color:var(--muted)}
.notice{font-family:var(--ui);font-size:var(--t-small);color:var(--muted);margin:24px 0}

/* progression et médailles */
.plite{margin-top:24px}
.closing{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);margin-top:32px;padding:14px 0 0;min-height:44px}
.pl-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl-txt{font-family:var(--ui);font-size:13px;color:var(--muted)}
.pl-rang{color:var(--ink);font-weight:500}
.bar{height:6px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.hair{height:1px;margin:8px 0}
.dots7{display:inline-flex;gap:4px;flex:none}
.dots7 i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots7 i.on{background:var(--accent)}
.mbar{display:flex;height:3px;background:var(--rule);border-radius:2px;margin-top:10px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent)}
.mbar i.half{background:var(--accent);opacity:.35}
details.more .s-open{display:none}
details.more[open] .s-open{display:inline}
details.more[open] .s-closed{display:none}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-size:13px;padding:4px 10px 4px 4px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink)}
.bchip .medal{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:11px;background:var(--accent);color:var(--on-accent)}
.bchip.locked{color:var(--muted);background:transparent;border-style:dashed}
.bchip.locked .medal{background:transparent;color:var(--muted);border:1px dashed var(--rule)}
details.more{margin-top:10px}
details.more summary{cursor:pointer;list-style:none;font-family:var(--ui);font-size:13px;color:var(--muted);min-height:36px;display:flex;align-items:center}
details.more summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;max-width:420px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--sheet);color:var(--ink);border:1px solid var(--accent);border-radius:2px;padding:8px 12px 8px 8px;font-family:var(--ui);font-size:13px;display:flex;gap:8px;align-items:center}
.toast span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .medal{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:12px;background:var(--accent);color:var(--on-accent);flex:none}
@media (min-width:700px){ body{font-size:17px} .slide{min-height:400px;padding:32px 34px} }
@media (prefers-reduced-motion:no-preference){.qcard,.deck{animation:rise .3s ease-out both}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
.week button.done .dot{background:var(--sheet);color:var(--accent);border-color:var(--accent)}
.week button.on.done .dot{background:var(--accent);color:var(--on-accent)}
.chip.lu{color:var(--muted)}
.closing .btn{margin-top:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>Le Banquet</h1>
    <span class="sem" id="sem">Une notion par semaine</span>
  </header>
  <main>
    <section id="v-jour" aria-label="Aujourd'hui">
      <div class="week" id="week"></div>
      <p class="hint week-hint" id="weekHint" aria-live="polite"></p>
      <div id="bannerHost"></div>
      <div id="cardHost"><p class="notice">La carte du jour arrive chaque matin vers 7h. Elle s'affichera ici, en quelques diapositives à faire glisser.</p></div>
    </section>
    <section id="v-reviser" aria-label="Réviser" hidden></section>
    <section id="v-penseurs" aria-label="Penseurs" hidden></section>
    <section id="v-index" aria-label="Parcours" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <button data-v="jour" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg>Aujourd'hui</button>
  <button data-v="reviser"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="12" height="16" rx="1.5"/><path d="M8 20.5h10.5c.6 0 1-.4 1-1V7"/></svg>Réviser<span class="badge" id="due" hidden></span></button>
  <button data-v="penseurs"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>Penseurs</button>
  <button data-v="index"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Parcours</button>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden><div class="in" id="sheetIn"></div></div>

<script>
/* ===== Le Banquet : cœur commun au site et à l'artefact. L'adaptateur (fin de fichier) fournit PLATFORM. ===== */
const S = {cartes:[], semaines:[], fiches:[], plan:null, reponses:{}, stats:{}, etat:{}, full:{}, sel:null, view:"jour", idx:"notions", filt:"Tout", q:"", game:null, ready:false};
const $ = s => document.querySelector(s);
const NNBSP = " ";
const typo = s => s.replace(/ ([?!;:»])/g, NNBSP+"$1").replace(/« /g, "«"+NNBSP);
const esc = s => typo(String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])));
const ETAPES = ["La question","La thèse","La contre-thèse","La littérature","Aujourd'hui","À vous","La synthèse"];
const INTERVALLES = [2,7,21,60,150,365];
const VIEWS = ["jour","reviser","penseurs","index"];
const JOURS_C = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const SMOOTH = () => reduceMotion() ? "auto" : "smooth";
const plur = (n,s,p) => `${n} ${n>1?(p||s+"s"):s}`;
const dropDot = s => String(s||"").trim().replace(/[.\s]+$/,"");
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }

function today(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value; return `${g("year")}-${g("month")}-${g("day")}`;
}
function addDays(d,n){const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/864e5)}
function frDate(d){return new Date(d+"T12:00:00Z").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"})}
function frJour(d){ const n=daysBetween(today(),d); if(n===0) return "aujourd'hui"; if(n===1) return "demain"; if(n>1&&n<7) return new Date(d+"T12:00:00Z").toLocaleDateString("fr-FR",{weekday:"long",timeZone:"UTC"}); return frDate(d) }
const paras = a => (Array.isArray(a)?a:String(a||"").split("\n")).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
function splitName(t){ const parts=String(t).trim().split(/\s+/); if(parts.length<2) return ["",t]; const p2=[...parts]; let ln=p2.pop(); while(p2.length && /^(de|d'|von|van|la|le|du|des)$/i.test(p2[p2.length-1])) ln=p2.pop()+" "+ln; return [p2.join(" "), ln] }
function hk(t){ let h=0; for(const c of String(t)) h=(h*31+c.charCodeAt(0))|0; return (h>>>0).toString(36) }

/* ---------- données dérivées ---------- */
const fiche = id => S.fiches.find(f=>f.id===id);
const penseurs = () => S.fiches.filter(f=>f.type==="Penseur");
function currentCard(){ const t=today(); return S.cartes.filter(c=>c.date<=t).sort((a,b)=>b.date.localeCompare(a.date))[0] || null }
function semaineCourante(){ const c=S.cartes.find(c=>c.date===S.sel); return c?S.semaines.find(s=>s.id===c.semaine):maNotion() }
/* parcours personnel : chacun suit une notion à son rythme, du jour 1 au jour 7 */
const publiees = id => S.cartes.filter(c=>c.semaine===id && c.date<=today()).sort((a,b)=>a.rang-b.rang);
const luesDe = id => publiees(id).filter(c=>isRead(c));
const semsAsc = () => [...S.semaines].sort((a,b)=>a.numero-b.numero);
function maNotion(){
  const id=S.stats.notion; const choisie=id&&S.semaines.find(s=>s.id===id); if(choisie) return choisie;
  const ss=semsAsc(); return ss.find(s=>publiees(s.id).some(c=>!isRead(c))) || ss[ss.length-1] || null;
}
function prochaineCarte(sem){ return sem ? (publiees(sem.id).find(c=>!isRead(c))||null) : null }
function choisirNotion(id){ saveStat({notion:id}); S.sel=null; $("#cardHost").dataset.d=""; show("jour") }
const nextOf = (e,t) => e.prochaine || addDays(e.vu||t,2);
function dueFiches(){ const t=today(); return S.fiches.filter(f=>{const e=S.etat[f.id]; return e && nextOf(e,t)<=t}).sort((a,b)=>nextOf(S.etat[a.id],t).localeCompare(nextOf(S.etat[b.id],t))) }
function nextDueDate(){ const t=today(); const ds=S.fiches.map(f=>S.etat[f.id]).filter(Boolean).map(e=>nextOf(e,t)).filter(d=>d>t).sort(); return ds[0]||null }
function anciennes(){ const t=today(); return S.fiches.filter(f=>{const e=S.etat[f.id]; return e && e.vu && daysBetween(e.vu,t)>=7}) }
function grandeDue(){ const last=S.stats.derniereGrande; return anciennes().length>=3 && (!last || daysBetween(last,today())>=7) }
function grandeDate(){ const vus=S.fiches.map(f=>S.etat[f.id]).filter(e=>e&&e.vu).map(e=>e.vu).sort(); return vus.length>=3 ? addDays(vus[2],7) : null }
function sujetDu(sem, rang){ const p=(sem&&sem.programme||[]).find(x=>x.rang===rang); return p ? dropDot(String(p.sujet).split(/ ?[:(]/)[0]) : "" }
const writeProg = o => PLATFORM.writeProg(o);
function markSeen(card){
  const t=today(), add={};
  (card.fiches||[]).concat(card.penseurs||[]).forEach(id=>{ if(fiche(id) && !S.etat[id]) add[id]={vu:t} });
  if(!Object.keys(add).length) return;
  Object.assign(S.etat,add); writeProg({etat:add});
}

/* ---------- navigation ---------- */
function show(v){
  S.view=v; if(isSheetOpen()) closeSheet(true);
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));
  VIEWS.forEach(k=>$("#v-"+k).hidden=k!==v);
  try{ if(location.hash.slice(1)!==v) history.replaceState(history.state,"","#"+v) }catch(e){}
  window.scrollTo(0,0); render();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(VIEWS.includes(h)&&h!==S.view) show(h)});
window.addEventListener("popstate",()=>{
  if(isSheetOpen()){ closeSheet(true); return }
  if(S.game){ S.game=null; renderReviser() }
});
function pushLayer(kind){ if(PLATFORM.useHistory){ try{ history.pushState({layer:kind},"",location.href) }catch(e){} } }
function popLayer(fallback){ if(PLATFORM.useHistory && history.state && history.state.layer){ history.back() } else fallback() }

function render(){
  const sem=semaineCourante();
  const nl=sem?luesDe(sem.id).length:0;
  $("#sem").innerHTML = sem ? `${esc(sem.domaine||"Notion")}<br><b>${esc(sem.notion)}</b> · ${nl}/7` : "Une notion par semaine";
  const n=dueFiches().length + (grandeDue()?1:0); $("#due").hidden=!n; $("#due").textContent=n;
  if(S.view==="jour") renderJour();
  if(S.view==="reviser" && !S.game) renderReviser();
  if(S.view==="penseurs") renderPenseurs();
  if(S.view==="index") renderIndex();
}

/* ---------- accueil d'un nouveau visiteur ---------- */
const INTRO_KEY="banquet.intro.v1";
function howHTML(court){
  return `<p>Une notion de philosophie ou de littérature par semaine, en sept cartes courtes. On les lit dans l'ordre, à son rythme, en commençant par le premier jour.</p>
    <p>${esc(PLATFORM.txtProg)}</p>
    ${court?"":`<p>Les sept cartes suivent toujours le même chemin : la question, la thèse, la contre-thèse, un roman, aujourd'hui, à vous, la synthèse. Les notions se choisissent dans Parcours.</p><p>L'onglet Réviser propose de petits jeux. Une réponse ratée revient le lendemain, une réponse sue revient de plus en plus tard.</p>`}
    ${PLATFORM.install?`<details class="howto"><summary>Ajouter Le Banquet à l'écran d'accueil</summary><p>C'est aussi ce qui protège votre progression : sur iPhone, Safari efface les données d'un site qu'on n'a pas ouvert depuis 7 jours, sauf s'il est sur l'écran d'accueil.</p><p><b>iPhone</b> : dans Safari, touche Partager, puis « Sur l'écran d'accueil ».</p><p><b>Android</b> : dans Chrome, touche ⋮, puis « Ajouter à l'écran d'accueil ».</p></details>`:""}`;
}
function introHTML(sem){
  if(lsGet(INTRO_KEY)) return "";
  const debut = sem && !luesDe(sem.id).length;
  return `<div class="note intro" id="intro"><p class="label" style="color:var(--accent)">Le Banquet</p>${howHTML(true)}
    <div class="row"><button class="btn" id="introOk">${debut?`Commencer par « ${esc(sem.notion)} »`:"Continuer"}</button>${S.semaines.length>1?`<button class="btn ghost" id="introPick">Voir les autres notions</button>`:""}</div></div>`;
}

/* ---------- Aujourd'hui ---------- */
function slidesFor(card){
  const out=[];
  out.push(`<div class="slide"><p class="eyebrow">Jour ${card.rang} · ${esc(card.etape||ETAPES[card.rang-1])}</p><h2>${esc(card.titre)}</h2>${card.accroche?`<p class="accroche">${esc(card.accroche)}</p>`:""}<p class="hint" style="margin-top:22px">Faites glisser →</p></div>`);
  (card.essentiel||[]).forEach((p,i)=>out.push(`<div class="slide"><div class="num" aria-hidden="true">${i+1}</div><p class="txt">${esc(p)}</p></div>`));
  if(card.extrait&&card.extrait.texte) out.push(`<div class="slide quote"><blockquote>« ${esc(card.extrait.texte)} »</blockquote><cite>${esc(card.extrait.auteur)}, <i>${esc(card.extrait.oeuvre)}</i>${card.extrait.date?" ("+esc(card.extrait.date)+")":""}${card.extrait.traduction?" · trad. "+esc(card.extrait.traduction):""}</cite></div>`);
  (card.exemples||[]).forEach(e=>out.push(`<div class="slide ex"><span class="kind">${esc(e.type||"Exemple")}</span><h3>${esc(e.titre)}</h3><p class="by">${esc(e.auteur||"")}</p><p class="txt">${esc(e.texte)}</p></div>`));
  if(card.idee) out.push(`<div class="slide idee"><p class="eyebrow">L'idée à retenir</p><p>${esc(card.idee)}</p></div>`);
  return out.map((h,i,a)=>h.replace('<div class="slide','<div role="group" aria-roledescription="diapositive" aria-label="'+(i+1)+' sur '+a.length+'" class="slide'));
}
function quizHTML(list, key){
  return `<div class="qblock">${list.map((q,i)=>`<div data-k="${key}" data-q="${i}"><p class="qq">${esc(q.question)}</p><div class="opts">${q.options.map((o,j)=>`<button data-j="${j}">${esc(o)}</button>`).join("")}</div><p class="ex" hidden aria-live="polite"></p></div>`).join("")}</div>`;
}
function verdict(good, bonne, expl){
  return good ? `<span class="verdict good">Bien vu.</span> ${esc(expl||"")}`
              : `<span class="verdict bad">Raté.</span> C'était <b>${esc(bonne)}</b>. ${esc(expl||"")}`;
}
function wireQuiz(host, lists){
  host.querySelectorAll("[data-k][data-q]").forEach(div=>{
    const q=lists[div.dataset.k][+div.dataset.q];
    div.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const good=+b.dataset.j===q.answer;
      div.querySelectorAll("button").forEach(x=>{x.disabled=true; if(+x.dataset.j===q.answer) x.classList.add("ok")});
      if(!good) b.classList.add("ko");
      const ex=div.querySelector(".ex"); ex.hidden=false; ex.innerHTML=verdict(good,q.options[q.answer],q.explication);
    });
  });
}
function weekHTML(sem){
  const t=today();
  return ETAPES.map((e,i)=>{
    const c=S.cartes.find(x=>x.semaine===sem.id&&x.rang===i+1), ok=c&&c.date<=t, lu=ok&&isRead(c);
    const lab=lu?"lue":ok?"à lire":"bientôt";
    return `<button class="${ok?"has":"future"} ${lu?"done":""} ${c&&c.date===S.sel?"on":""}" data-d="${ok?c.date:""}" data-r="${i+1}" data-day="${addDays(sem.debut,i)}" aria-label="Jour ${i+1}, ${esc(e)}, ${lab}"><span class="dot">${lu?"✓":i+1}</span><span class="lab">${lab}</span></button>`}).join("");
}
function renderJour(){
  const t=today(); let sem=semaineCourante();
  if(!S.sel || !S.cartes.find(c=>c.date===S.sel)){
    const mine=maNotion(), nx=prochaineCarte(mine), lus=mine?luesDe(mine.id):[];
    S.sel = nx ? nx.date : (lus.length ? lus[lus.length-1].date : (currentCard()||{}).date || null);
    sem=semaineCourante();
  }
  const wk=$("#week");
  if(sem){
    wk.innerHTML=weekHTML(sem);
    wk.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      if(b.dataset.d){ $("#weekHint").textContent=""; S.sel=b.dataset.d; render(); return }
      const r=+b.dataset.r, sujet=sujetDu(sem,r);
      $("#weekHint").textContent=`Jour ${r} · ${ETAPES[r-1]} : cette carte sera publiée ${frJour(b.dataset.day)} vers 7h${sujet?". Au programme : "+sujet+".":"."}`.replace(/ ([?!;:])/g,NNBSP+"$1");
    });
  } else wk.innerHTML="";
  let top=introHTML(sem);
  if(sem && S.stats.notion!==sem.id && S.semaines.length>1 && lsGet(INTRO_KEY) && sem.id!==(maNotion()||{}).id) top+=`<div class="note banner"><p>Vous relisez « ${esc(sem.notion)} ».</p><button class="btn ghost" id="suivre">En faire votre notion</button></div>`;
  if(grandeDue()) top+=`<div class="note banner"><p><b>Grande révision de la semaine.</b> Dix questions sur ce que vous avez lu il y a plus d'une semaine.</p><button class="btn" id="goGrande">Jouer</button></div>`;
  $("#bannerHost").innerHTML=top;
  if($("#goGrande")) $("#goGrande").onclick=()=>{show("reviser");startGame("grande")};

/* lecture : comptée quand on arrive à la dernière diapositive ou qu'on finit le défi */
function isRead(card){ return (S.stats.lues||[]).includes(card.date) }
function finishReading(card,nSlides){
  if(!S.ready || !card || card.date>today() || isRead(card)) return;
  const t=today(), o={lues:[...(S.stats.lues||[]),card.date].slice(-1000)};
  if(!(S.stats.jours||[]).includes(t)) o.jours=[...(S.stats.jours||[]),t].slice(-400);
  if(!S.stats.notion) o.notion=card.semaine;

  const wk=$("#week"), sem=S.semaines.find(x=>x.id===card.semaine); if(wk&&sem){ wk.innerHTML=weekHTML(sem); }
  
}
function wireClosing(card){

function closingHTML(card,nSlides){

  }

function wireDefi(host,card,nSlides){
  const d=defiList(card), deck=host.querySelector("#ddeck"); if(!d.length||!deck) return;
  let ok=0; const answered=new Set();
  const cards=[...deck.querySelectorAll(".dcard")];
  const go=i=>{ const c=cards[i]; if(!c) return; c.hidden=false; c.classList.add("solo"); cards.forEach((x,k)=>{ if(k!==i) x.hidden=true }); deck.scrollTo({left:0,behavior:"auto"}); const p=$("#dpos"); if(p) p.textContent=i<d.length?`${i+1} / ${d.length}`:"Terminé" };
  cards.forEach(c=>c.classList.add("solo"));
  cards.slice(0,d.length).forEach((c,i)=>{
    const q=d[i];
    c.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
      if(answered.has(i)) return; answered.add(i);
      const good=+b.dataset.j===q.answer; if(good) ok++;
      c.querySelectorAll(".opts button").forEach(x=>{x.disabled=true; if(+x.dataset.j===q.answer) x.classList.add("ok")});
      if(!good) b.classList.add("ko");
      const r=c.querySelector(".res"); r.hidden=false; r.innerHTML=verdict(good,q.options[q.answer],q.explication);
      c.querySelector(".go").hidden=false;
      if(answered.size===d.length){
        const o={defis:stat("defis")+1}; if(ok===d.length) o.sansFaute=stat("sansFaute")+1; saveStat(o);
        $("#dsc").innerHTML=`${ok}<small> / ${d.length}</small>`;
        $("#dmsg").textContent= ok===d.length?"Sans faute.":"Les questions ratées reviendront dans les révisions.";
        finishReading(card,nSlides); checkBadges();

  });
}

/* ---------- progression et médailles ---------- */
const RANGS=[[0,"Convive"],[15,"Disciple"],[45,"Exégète"],[100,"Philosophe"],[200,"Sage"],[400,"Hôte du Banquet"]];
function stat(k){ return S.stats[k]||0 }
function streak(){ const set=new Set(S.stats.jours||[]); let d=today(); if(!set.has(d)) d=addDays(d,-1); let n=0; while(set.has(d)){ n++; d=addDays(d,-1) } return n }
function bestStreak(){ const js=[...(S.stats.jours||[])].sort(); let best=0,cur=0,prev=null; js.forEach(d=>{ cur = prev && addDays(prev,1)===d ? cur+1 : 1; best=Math.max(best,cur); prev=d }); return best }
function progress(){
  const vus=Object.keys(S.etat).filter(id=>fiche(id));
  const niv=vus.reduce((a,id)=>a+(S.etat[id].niveau||0),0);
  const ancres=vus.filter(id=>(S.etat[id].niveau||0)>=3).length;
  const penseursVus=vus.filter(id=>(fiche(id)||{}).type==="Penseur").length;
  const xp=vus.length+niv*2+stat("parties")*2+stat("defis")+stat("grandes")*5;
  let r=0; RANGS.forEach((x,i)=>{ if(xp>=x[0]) r=i });
  return {vus:vus.length,niv,ancres,penseursVus,xp,r};
}
function notionsBouclees(){ const lues=new Set(S.stats.lues||[]); return S.semaines.filter(s=>{ const cs=S.cartes.filter(c=>c.semaine===s.id); return cs.length>=7 && cs.every(c=>lues.has(c.date)) }).length }
const BADGES=[
  {id:"premier",m:"I",n:"Premier couvert",d:"Lire une première carte en entier",ok:p=>(S.stats.lues||[]).length>=1},
  {id:"serie3",m:"3",n:"Pilier de table",d:"3 jours d'affilée",ok:p=>bestStreak()>=3},
  {id:"serie7",m:"7",n:"Une semaine à table",d:"7 jours d'affilée",ok:p=>bestStreak()>=7},
  {id:"sansfaute",m:"✓",n:"Sans faute",d:"Un défi ou un jeu parfait",ok:p=>stat("sansFaute")>=1},
  {id:"gourmande",m:"V",n:"Bon appétit",d:"5 parties de révision",ok:p=>stat("parties")>=5},
  {id:"dix",m:"X",n:"Dix convives",d:"10 penseurs rencontrés",ok:p=>p.penseursVus>=10},
  {id:"grande",m:"G",n:"Grande révision",d:"Une première grande révision",ok:p=>stat("grandes")>=1},
  {id:"notion",m:"N",n:"Notion bouclée",d:"Les 7 cartes d'une semaine",ok:p=>notionsBouclees()>=1},
  {id:"marbre",m:"M",n:"Gravé dans le marbre",d:"Une fiche retenue 3 fois de suite",ok:p=>p.ancres>=1},
  {id:"mois",m:"30",n:"Un mois de banquet",d:"30 jours de lecture",ok:p=>(S.stats.jours||[]).length>=30},
  {id:"biblio",m:"L",n:"Bibliothèque",d:"50 fiches rencontrées",ok:p=>p.vus>=50},
  {id:"quatre",m:"IV",n:"Quatre notions",d:"4 notions bouclées",ok:p=>notionsBouclees()>=4}
];

  if(!S.ready) return;

/* ---------- Réviser ---------- */
const DISTRACTEURS=["Platon","Aristote","Épicure","Sénèque","Montaigne","Descartes","Pascal","Spinoza","Rousseau","Kant","Hegel","Schopenhauer","Nietzsche","Bergson","Simone de Beauvoir","Sartre","Camus","Hannah Arendt","Simone Weil","Freud"];
function pools(){
  const P=penseurs();
  const quotes=[]; P.forEach(p=>{(p.citations||[]).forEach(c=>quotes.push({p,texte:c.texte,source:c.source,cit:true,key:"q:"+p.id+":"+hk(c.texte)})); (p.theses||[]).forEach(t=>quotes.push({p,texte:t,cit:false,key:"q:"+p.id+":"+hk(t)}))});
  const qcm=[]; S.fiches.forEach(f=>(f.qcm||[]).forEach((q,i)=>qcm.push({f,q,key:"c:"+f.id+":"+i})));
  return {P,quotes,qcm};
}
function mastery(){
  const {P,quotes,qcm}=pools(), m=S.stats.maitrise||{}, ok=k=>(m[k]||0)>=2, enc=k=>(m[k]||0)===1;
  const vus=Object.keys(S.etat).filter(id=>fiche(id));
  return {
    cartes:{n:vus.filter(id=>(S.etat[id].niveau||0)>=2).length,e:vus.filter(id=>(S.etat[id].niveau||0)===1).length,t:vus.length,u:"ancrées"},
    quiadit:{n:quotes.filter(q=>ok(q.key)).length,e:quotes.filter(q=>enc(q.key)).length,t:quotes.length,u:"reconnues"},
    nom:{n:P.filter(p=>ok("n:"+p.id)).length,e:P.filter(p=>enc("n:"+p.id)).length,t:P.length,u:"reconnus"},
    qcm:{n:qcm.filter(q=>ok(q.key)).length,e:qcm.filter(q=>enc(q.key)).length,t:qcm.length,u:"maîtrisées"}
  };
}
function tile(g,titre,desc,mm,extra,disabled){
  const pn=mm.t?mm.n/mm.t*100:0, pe=mm.t?mm.e/mm.t*100:0, reste=mm.t-mm.n-mm.e;

  return `<button class="game" data-g="${g}" ${disabled?"disabled":""}><span class="gt">${titre}</span><span class="gd">${desc}</span>
    <span class="mbar" aria-hidden="true"><i style="width:${pn}%"></i><i class="half" style="width:${pe}%"></i></span><span class="mtx">${extra?esc(extra):etat}</span></button>`;
}

const court = p => /^(Simone|Hannah)$/.test(splitName(p.terme)[0]) ? p.terme : splitName(p.terme)[1];
function nameOptions(correctName, others, n){
  const pool=[...new Set([...shuffle(others), ...shuffle(DISTRACTEURS)])].filter(x=>norm(x)!==norm(correctName) && !norm(correctName).includes(norm(x)) && !norm(x).includes(norm(correctName)));
  const o=shuffle([correctName, ...pool.slice(0,n-1)]);
  return {options:o, answer:o.indexOf(correctName)};
}
function makeQ(kind, src){
  const {P}=pools(), n=P.length>=4?4:3;
  if(kind==="quiadit"){ const q=src, others=P.filter(p=>p.id!==q.p.id).map(court); const {options,answer}=nameOptions(court(q.p),others,n);
    return {kind:"Qui a dit ça ?",prompt:q.texte,quote:q.cit,src:q.cit&&q.source?q.source:"",options,answer,fiche:q.p.id,key:q.key,explication:dropDot(q.p.enUnMot||q.p.resume)+"."} }
  if(kind==="nom"){ const p=src, others=P.filter(x=>x.id!==p.id).map(court); const {options,answer}=nameOptions(court(p),others,n); const th=(p.theses||[])[0]||p.resume;
    return {kind:"Le bon nom",prompt:th,src:[p.dates,p.pays].filter(Boolean).join(", "),options,answer,fiche:p.id,key:"n:"+p.id,explication:p.memo||p.resume} }
  if(kind==="qcm"){ return {kind:"QCM · "+src.f.terme,prompt:src.q.question,options:src.q.options,answer:src.q.answer,fiche:src.f.id,key:src.key,explication:src.q.explication||""} }
}
function startGame(g){
  const {P,quotes,qcm}=pools(); let qs=[];
  if(g==="cartes"){ const c=dueFiches(); if(!c.length) return; S.game={g,cards:c,i:0,shown:false,score:0}; pushLayer("game"); return renderGame() }
  if(g==="quiadit") qs=shuffle(quotes).slice(0,Math.min(8,quotes.length)).map(q=>makeQ("quiadit",q));
  if(g==="nom") qs=shuffle(P).slice(0,Math.min(8,P.length)).map(p=>makeQ("nom",p));
  if(g==="qcm") qs=shuffle(qcm).slice(0,Math.min(8,qcm.length)).map(q=>makeQ("qcm",q));
  if(g==="grande"){
    const oldIds=new Set(anciennes().map(f=>f.id));
    const w=x=>1/(((S.etat[x.fiche]||{}).niveau||0)+1);
    const pool=[...quotes.filter(q=>oldIds.has(q.p.id)).map(q=>makeQ("quiadit",q)),
                ...P.filter(p=>oldIds.has(p.id)).map(p=>makeQ("nom",p)),
                ...qcm.filter(q=>oldIds.has(q.f.id)).map(q=>makeQ("qcm",q))];
    qs=shuffle(pool).sort((a,b)=>w(b)-w(a)+(Math.random()-.5)).slice(0,10);
  }
  if(!qs.length) return;
  S.game={g,qs,i:0,score:0,picked:null,enRoute:new Set()}; pushLayer("game"); renderGame();
}
function quitGame(){ popLayer(()=>{ S.game=null; renderReviser() }) }
function renderGame(){
  const host=$("#v-reviser"), G=S.game;
  const total=G.g==="cartes"?G.cards.length:G.qs.length;
  if(G.i>=total){
    const enRoute=G.enRoute?[...G.enRoute].filter(k=>((S.stats.maitrise||{})[k]||0)===1).length:0;
    host.innerHTML=`<div class="play"><div class="score"><p class="label">Terminé</p><div class="big">${G.score}<small> / ${total}</small></div>
      <p>${G.score===total?"Sans faute.":G.score>=total*0.7?"Solide. Les ratées reviendront demain.":"Les ratées reviendront demain."}</p>
      ${enRoute?`<p class="hint">${plur(enRoute,"réponse")} en route : encore une bonne réponse pour ${enRoute>1?"les":"l'"}ancrer.</p>`:""}
      <div class="row" style="margin-top:16px"><button class="btn" id="again">Rejouer</button><button class="btn ghost" id="back">Retour</button></div></div></div>`;
    if(!G.done){ G.done=true; const o={parties:stat("parties")+1}; if(G.score===total) o.sansFaute=stat("sansFaute")+1; if(G.g==="grande"){ o.derniereGrande=today(); o.grandes=stat("grandes")+1; o.grandeScore=G.score } saveStat(o); checkBadges() }
    $("#again").onclick=()=>{ const g=G.g; S.game=null; if(PLATFORM.useHistory&&history.state&&history.state.layer){ history.replaceState(null,"",location.href) } startGame(g) };
    $("#back").onclick=quitGame; return;
  }
  let body="";
  if(G.g==="cartes"){
    const f=G.cards[G.i];
    body=`<div class="qcard"><span class="kind">${esc(f.type)}${f.dates?" · "+esc(f.dates):""}</span><div class="terme">${esc(f.terme)}</div><p class="ask">${esc(f.question||"Que savez-vous de cette fiche ?")}</p>
      ${G.shown?`<div class="back">${f.formule?`<p class="formule">${esc(f.formule)}</p>`:""}<p>${esc(f.resume)}</p>${f.memo?`<p class="hint">Pour retenir : ${esc(f.memo)}</p>`:""}</div>`:""}
      <div class="acts row">${G.shown?`<button class="btn" id="ok">Je savais</button><button class="btn ghost" id="ko">À revoir</button>`:`<button class="btn" id="flip">Retourner la carte</button>`}</div></div>`;
  } else {
    const q=G.qs[G.i], done=G.picked!==null, good=done&&G.picked===q.answer;
    body=`<div class="qcard"><span class="kind">${esc(q.kind)}</span><p class="prompt">${q.quote?"« ":""}${esc(q.prompt)}${q.quote?" »":""}</p>${q.src?`<p class="src">${esc(q.src)}</p>`:""}
      <div class="opts">${q.options.map((o,j)=>`<button data-j="${j}" ${done?"disabled":""} class="${done&&j===q.answer?"ok":""} ${done&&j===G.picked&&j!==q.answer?"ko":""}">${esc(o)}</button>`).join("")}</div>
      <div aria-live="polite">${done?`<p class="feedback"><span class="verdict ${good?"good":"bad"}">${good?"Bien vu.":"Raté."}</span><span class="who">${good?"":"C'était "}${esc(q.options[q.answer])}</span>${esc(q.explication)}</p>`:""}</div>
      <div class="acts row">${done?`<button class="btn" id="nextq">${G.i<total-1?"Suivante":"Voir le score"}</button>${q.fiche?`<button class="btn ghost" data-f="${esc(q.fiche)}">Voir la fiche</button>`:""}`:""}</div></div>`;
  }
  host.innerHTML=`<div class="play"><div class="top"><button id="quit">← Arrêter</button><span class="hint">${G.i+1} / ${total}</span></div><div class="prog"><i style="width:${G.i/total*100}%"></i></div>${body}</div>`;
  $("#quit").onclick=quitGame;
  if(G.g==="cartes"){
    if($("#flip")) $("#flip").onclick=()=>{G.shown=true;renderGame()};
    if($("#ok")) $("#ok").onclick=()=>{grade(G.cards[G.i],true,true);G.score++;G.i++;G.shown=false;renderGame()};
    if($("#ko")) $("#ko").onclick=()=>{grade(G.cards[G.i],false,true);G.i++;G.shown=false;renderGame()};
  } else {
    host.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
      const q=G.qs[G.i]; G.picked=+b.dataset.j; const ok=G.picked===q.answer; if(ok)G.score++;
      const f=fiche(q.fiche); if(f) grade(f,ok,false);
      if(q.key){ const m=Object.assign({},S.stats.maitrise||{}); m[q.key]=ok?Math.min((m[q.key]||0)+1,9):0; S.stats.maitrise=m; writeProg({maitrise:{[q.key]:m[q.key]}}); if(ok) G.enRoute.add(q.key) }
      renderGame();
    });
    if($("#nextq")) $("#nextq").onclick=()=>{G.i++;G.picked=null;renderGame()};
    host.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>openFiche(b.dataset.f));
  }
}
function grade(f, ok, force){
  const t=today(), e=S.etat[f.id]||{vu:t}, due=nextOf(e,t)<=t;
  let niveau=e.niveau||0, prochaine=e.prochaine;
  if(!ok){ niveau=0; prochaine=addDays(t,1) }
  else if(due||force){ niveau=Math.min(niveau+1,INTERVALLES.length); prochaine=addDays(t,INTERVALLES[niveau-1]) }
  else if(S.etat[f.id]) return;
  const ne={vu:e.vu||t,niveau,...(prochaine?{prochaine}:{})};
  S.etat[f.id]=ne;
  const n=dueFiches().length+(grandeDue()?1:0); $("#due").hidden=!n; $("#due").textContent=n;
  writeProg({etat:{[f.id]:ne}});
}
function saveStat(o){ S.stats=Object.assign({},S.stats,o); writeProg(o) }

/* ---------- Parcours ---------- */
function venirPour(nom){
  const sem=semaineCourante(); if(!sem) return null;
  const p=(sem.programme||[]).find(x=>norm(x.sujet).includes(norm(nom)));
  return p ? addDays(sem.debut,p.rang-1) : null;
}
function searchText(f){ return norm([f.terme,f.resume,f.enUnMot,f.memo,f.formule,f.explication,(f.oeuvres||[]).join(" "),(f.theses||[]).join(" "),(f.citations||[]).map(c=>c.texte).join(" ")].join(" ")) }

}

const isSheetOpen = () => !$("#sheet").hidden;
function openFiche(id){
  const f=fiche(id); if(!f) return; const t=today();
  if(!isSheetOpen()){ lastFocus=document.activeElement; pushLayer("sheet") }
  let h=`<div class="closebar"><button class="close" id="closeSheet">← Retour</button></div>`;
  if(f.type==="Penseur"){
    const [fn,ln]=splitName(f.terme);
    h+=`<div class="idcard"><div class="fn">${esc(fn)}</div><h2 class="ln" id="sheetTitle" tabindex="-1" style="margin:0">${esc(ln)}</h2><div class="meta">${f.dates?`<span>${esc(f.dates)}</span>`:""}${f.pays?`<span>${esc(f.pays)}</span>`:""}${f.oeuvres&&f.oeuvres.length?`<span>${esc(f.oeuvres.join(" · "))}</span>`:""}</div>${f.enUnMot?`<div class="mot">${esc(f.enUnMot)}</div>`:""}</div>`;

    if(f.explication) h+=`<div class="sec prose"><p class="label">Le contexte</p>${paras(f.explication)}</div>`;
    if((f.dialogue||[]).length) h+=`<div class="sec"><p class="label">Avec qui il dialogue</p><div class="rows">${f.dialogue.map(d=>{const o=fiche(d.id), nom=o?o.terme:(d.nom||d.id), quand=o?null:venirPour(nom);

  loadLocal(); S.ready=true; bootCommon();
  try{
    const [idx,fi]=await Promise.all([getJSON("data/index.json"),getJSON("data/fiches.json")]);
    S.cartes=idx.cartes||[]; S.semaines=(idx.semaines||[]).sort((a,b)=>a.numero-b.numero); S.plan={suivantes:idx.aVenir||[],choix:idx.prochaine||null};
    S.fiches=Object.entries(fi.fiches||{}).map(([id,f])=>({...f,id}));
    render();
  }catch(e){ $("#cardHost").innerHTML='<p class="notice">Le Banquet ne s\'est pas chargé. Vérifiez la connexion et rechargez la page.</p>' }
})();

</script>
</body>
